name: Build Map Tiles

on:
  # Build the sample tiles on every push to main
  push:
    branches:
      - main
      - master

  # Build the full Scotland tile sets when a release is published
  release:
    types: [published]

  # Manual run (always the sample; full builds only happen on a release)
  workflow_dispatch:

jobs:
  build-tiles:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed to upload release assets

    strategy:
      fail-fast: false
      matrix:
        tileset: [topology, dbobih, trigs]

    env:
      # Full builds only happen on a release, and the release tag becomes the
      # version directory in the tile URLs: {tileset}/{tag}/{z}/{x}/{y}.png
      MODE: ${{ github.event_name == 'release' && 'full' || 'sample' }}
      TILE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || 'sample' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # The project was saved with a recent QGIS and the Ubuntu package is
      # too old to render it faithfully, so use the QGIS LTR repository.
      - name: Install QGIS and GDAL
        run: |
          sudo mkdir -p /etc/apt/keyrings
          sudo curl -sSfL -o /etc/apt/keyrings/qgis-archive-keyring.gpg \
            https://download.qgis.org/downloads/qgis-archive-keyring.gpg
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://qgis.org/ubuntu-ltr' \
            "Suites: $(lsb_release -cs)" \
            'Architectures: amd64' \
            'Components: main' \
            'Signed-By: /etc/apt/keyrings/qgis-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/qgis.sources
          sudo apt-get update
          sudo apt-get install -y qgis python3-qgis qgis-providers gdal-bin fonts-lato fonts-inter curl unzip

      # Only the topology tiles need the elevation data
      - name: Build DEM, hillshade and contours
        if: matrix.tileset == 'topology'
        run: make dem

      - name: Build sample tiles
        if: env.MODE == 'sample'
        run: make QGIS_PYTHON=/usr/bin/python3 TILE_VERSION=${{ env.TILE_VERSION }} ${{ matrix.tileset }} TILE_BBOX=-4.5,56.2,-4.2,56.35 TILE_ZMAX=12
        timeout-minutes: 60

      - name: Build full tiles
        if: env.MODE == 'full'
        run: make QGIS_PYTHON=/usr/bin/python3 TILE_VERSION=${{ env.TILE_VERSION }} ${{ matrix.tileset }}
        timeout-minutes: 360

      - name: Package tiles
        run: |
          tar -C data/tiles -czf ${{ matrix.tileset }}-${{ env.TILE_VERSION }}.tar.gz ${{ matrix.tileset }}
          du -sh ${{ matrix.tileset }}-${{ env.TILE_VERSION }}.tar.gz data/tiles/${{ matrix.tileset }}

      - name: Upload tiles as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tileset }}-${{ env.TILE_VERSION }}
          path: ${{ matrix.tileset }}-${{ env.TILE_VERSION }}.tar.gz
          retention-days: ${{ env.MODE == 'full' && 90 || 30 }}

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.tileset }}-${{ env.TILE_VERSION }}.tar.gz
