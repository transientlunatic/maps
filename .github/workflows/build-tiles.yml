name: Build Map Tiles

on:
  # Build the sample tiles on every push to main
  push:
    branches:
      - main
      - master

  # Build the full Scotland tile sets when a release is published
  release:
    types: [published]

  # Manual run (always the sample; full builds only happen on a release)
  workflow_dispatch:

# The build runs in four stages so that the slow part, rendering tiles, can be spread
# over many jobs:
#   plan     work out the version, area and the list of jobs (tile set x shard)
#   data     build the data files once (DEM, hillshade, contours, OSM extracts, loch names)
#   tiles    render every tile set for one shard (a slice of the area) per job
#   release  attach all the shards to the release (releases only)
#   publish  copy the tiles to the tile server over ssh (releases only)
# A full build is cut into SHARD_COLS x SHARD_ROWS shards (repository variables, 2 x 4 by
# default). Shards follow zoom 9 tile edges, so their tiles never overlap.
#
# A release builds only the light tile sets (TILESETS_LIGHT in the Makefile), which take minutes
# per shard. The heavy ones (the topology, Imhof style, forests and the big line layers) run for
# hours per shard, longer than a job is allowed, so they are built with HTCondor instead: see
# scripts/make_dag.py and the README. Set the repository variable CI_TILESETS (comma separated)
# to build a different list here. Pushes to main build every tile set, but only for the small
# sample area.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      data: ${{ steps.plan.outputs.data }}
      version: ${{ steps.plan.outputs.version }}
      zmax: ${{ steps.plan.outputs.zmax }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Plan the build
        id: plan
        env:
          SHARD_COLS: ${{ vars.SHARD_COLS || 2 }}
          SHARD_ROWS: ${{ vars.SHARD_ROWS || 4 }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CI_TILESETS: ${{ vars.CI_TILESETS }}
        run: |
          if [ "$EVENT" = "release" ]; then
            # The release tag becomes the version directory in the tile URLs:
            # {tileset}/{tag}/{z}/{x}/{y}.png
            mode=full
            if [ -n "$CI_TILESETS" ]; then
              tilesets="$CI_TILESETS"
              data=data-all   # the list may include heavy tile sets
            else
              tilesets=$(make -s print-TILESETS_LIGHT | tr ' ' ',')
              data=data-light
            fi
            version="$RELEASE_TAG"
            zmax=$(make -s print-TILE_ZMAX)
            matrix=$(python3 scripts/shards.py --bbox="$(make -s print-TILE_BBOX)" \
              --cols "$SHARD_COLS" --rows "$SHARD_ROWS" --tilesets "$tilesets")
          else
            mode=sample
            tilesets=$(make -s print-TILESETS | tr ' ' ',')
            data=data-all
            version=sample
            zmax=$(make -s print-SAMPLE_ZMAX)
            matrix=$(python3 scripts/shards.py --bbox="$(make -s print-SAMPLE_BBOX)" \
              --cols 1 --rows 1 --tilesets "$tilesets")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "data=$data" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zmax=$zmax" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$mode build, version $version, $(echo "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))') tile jobs"

  data:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TILE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Get the current month (cache key)
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Install GDAL and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-shapely python3-scipy python3-numpy curl unzip

      # The OSM extract changes slowly, so reuse it for a month
      - name: Cache OSM extract
        uses: actions/cache@v4
        with:
          path: data/scotland.osm.pbf
          key: osm-scotland-${{ steps.month.outputs.month }}

      # The geology comes from the BGS web map service and takes a few minutes to fetch,
      # but it hardly ever changes, so keep it. Change the key to fetch it again.
      - name: Cache the geology
        uses: actions/cache@v4
        with:
          path: data/geology.tif
          key: geology-v1

      # A release needs only the data for the light tile sets; the sample needs all of it
      - name: Build the data
        run: make ${{ needs.plan.outputs.data }}

      # The loch names are vector data, so they are finished here rather than rendered
      - name: Build the loch names
        run: |
          make waternames
          tar -C data/tiles -czf waternames-${{ env.TILE_VERSION }}.tar.gz waternames
          mkdir -p assets && mv waternames-${{ env.TILE_VERSION }}.tar.gz assets/

      - name: Upload the loch names
        uses: actions/upload-artifact@v4
        with:
          name: tiles-waternames
          path: assets/*.tar.gz
          retention-days: ${{ needs.plan.outputs.mode == 'full' && 90 || 30 }}

      # So are the hills, which the browser draws from a JSON file
      - name: Build the hills
        run: |
          make hills
          tar -C data/tiles -czf hills-${{ env.TILE_VERSION }}.tar.gz hills
          mkdir -p hill-assets && mv hills-${{ env.TILE_VERSION }}.tar.gz hill-assets/

      - name: Upload the hills
        uses: actions/upload-artifact@v4
        with:
          name: tiles-hills
          path: hill-assets/*.tar.gz
          retention-days: ${{ needs.plan.outputs.mode == 'full' && 90 || 30 }}

      # Every tile job needs these, so pass them on as one artifact
      - name: Upload the data files
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            data/merged-dem.tif
            data/hill-shade-merged.tif
            data/contours-merged.gpkg
            data/mist.tif
            data/imhof-shade-3x.tif
            data/sea.gpkg
            data/transport.gpkg
            data/roads.gpkg
            data/shelters.gpkg
            data/paths.gpkg
            data/rivers.gpkg
            data/facilities.gpkg
            data/crags.gpkg
            data/geology.tif
          retention-days: 1
          compression-level: 1

  tiles:
    needs: [plan, data]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TILE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # The project was saved with a recent QGIS and the Ubuntu package is
      # too old to render it faithfully, so use the QGIS LTR repository.
      - name: Install QGIS
        run: |
          sudo mkdir -p /etc/apt/keyrings
          sudo curl -sSfL -o /etc/apt/keyrings/qgis-archive-keyring.gpg \
            https://download.qgis.org/downloads/qgis-archive-keyring.gpg
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://qgis.org/ubuntu-ltr' \
            "Suites: $(lsb_release -cs)" \
            'Architectures: amd64' \
            'Components: main' \
            'Signed-By: /etc/apt/keyrings/qgis-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/qgis.sources
          sudo apt-get update
          sudo apt-get install -y qgis python3-qgis qgis-providers fonts-lato fonts-inter

      - name: Download the data files
        uses: actions/download-artifact@v4
        with:
          name: data
          path: data

      - name: Render ${{ matrix.tileset }} (${{ matrix.shard }})
        run: |
          make render-${{ matrix.tileset }} QGIS_PYTHON=/usr/bin/python3 \
            TILE_VERSION="$TILE_VERSION" TILE_BBOX="${{ matrix.bbox }}" \
            TILE_ZMAX=${{ needs.plan.outputs.zmax }}

      - name: Package the tiles
        run: |
          mkdir -p assets
          tar -C data/tiles -czf "assets/${{ matrix.tileset }}-$TILE_VERSION-${{ matrix.shard }}.tar.gz" ${{ matrix.tileset }}
          du -sh data/tiles/${{ matrix.tileset }} assets/*.tar.gz

      - name: Upload the tiles
        uses: actions/upload-artifact@v4
        with:
          name: tiles-${{ matrix.tileset }}-${{ matrix.shard }}
          path: assets/*.tar.gz
          retention-days: ${{ needs.plan.outputs.mode == 'full' && 90 || 30 }}

  release:
    if: github.event_name == 'release'
    needs: [plan, tiles, data]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to upload release assets
    steps:
      # Each shard is a tar.gz named <tileset>-<version>-<shard>.tar.gz. Unpack them all
      # into the same directory to get the full tile tree.
      - name: Download all the tile shards
        uses: actions/download-artifact@v4
        with:
          pattern: tiles-*
          path: assets
          merge-multiple: true

      - name: List the release assets
        run: ls -lh assets

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*.tar.gz

  # Copy the tiles to the tile server, next to the older versions. It needs the repository
  # secrets SSH_KEY (a private key), SSH_HOST and SSH_USER, and optionally the repository
  # variable TILES_PATH (the tile server's directory on that host). Without the secrets the
  # job is skipped, so releases still work before the server is set up.
  publish:
    if: github.event_name == 'release'
    needs: [plan, tiles, data]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: publish-tiles
      cancel-in-progress: false
    env:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      TILES_PATH: ${{ vars.TILES_PATH || '/home/danwilliams/tiles.daniel-williams.co.uk/' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tile server settings
        id: settings
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::notice::SSH_KEY, SSH_HOST or SSH_USER is not set, so the tiles were not published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all the tile shards
        if: steps.settings.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: tiles-*
          path: assets
          merge-multiple: true

      - name: Publish to the tile server
        if: steps.settings.outputs.skip != 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/tile_server_key
          chmod 600 ~/.ssh/tile_server_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          export RSYNC_RSH="ssh -i $HOME/.ssh/tile_server_key"
          scripts/publish_tiles.sh assets "$SSH_USER@$SSH_HOST:$TILES_PATH"
